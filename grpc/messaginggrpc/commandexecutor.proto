edition = "2024";
package dogma.messaging.v1;

option go_package = "github.com/dogmatiq/enginekit/grpc/messaginggrpc";

import "github.com/dogmatiq/enginekit/protobuf/envelopepb/envelope.proto";
import "github.com/dogmatiq/enginekit/protobuf/uuidpb/uuid.proto";

// CommandExecutorAPI is a service for executing commands within a Dogma
// application hosted by the engine on the server.
service CommandExecutorAPI {
  // ExecuteCommand submits a command for execution, and optionally observes
  // the events that are recorded as a result of executing it.
  //
  // If the requested application key is unknown to the server it MUST return
  // a NOT_FOUND error with an attached [UnrecognizedApplication] value. See
  // [UnrecognizedApplicationError].
  //
  // If the requested command type ID does not identify a command that is
  // executable within the target application the server MUST return an
  // INVALID_ARGUMENT error with an attached [UnrecognizedCommandType] value.
  // See [UnrecognizedCommandTypeError].
  //
  // If the command data cannot be unmarshaled the server MUST return an
  // INVALID_ARGUMENT error with an attached [MalformedCommand] value. See
  // [MalformedCommandError].
  //
  // If the command is well-formed but fails the application's validation
  // logic the server MUST return an INVALID_ARGUMENT error with an attached
  // [InvalidCommand] value. See [InvalidCommandError].
  //
  // The requested event type IDs MUST identify event types that may be
  // recorded by the target application. If any other type IDs are requested
  // the server MUST return an INVALID_ARGUMENT error with an attached
  // [UnrecognizedEventType] value for each unrecognized type ID. See
  // [UnrecognizedEventTypeError].
  //
  // The first response MUST be a [CommandAccepted] operation, sent once the
  // engine has taken ownership of the command. Ownership means that the
  // command has been durably accepted for execution; it does not mean that
  // handling of the command is complete.
  //
  // Subsequent responses each deliver a single event that was recorded as a
  // result of executing the command and that matches one of the requested
  // event type IDs. If no event type IDs are requested the server MUST end
  // the stream immediately after sending the [CommandAccepted] operation.
  //
  // The server MUST end the stream with an OK status once it determines that
  // no further relevant events can occur. Any other outcome, such as a
  // network failure or server shutdown, leaves the client unable to resume
  // observation; the client may re-execute the command using the same
  // idempotency key to confirm its acceptance.
  //
  // If the command is a duplicate, as identified by its idempotency key, the
  // server MUST NOT execute it again, but MUST still send a [CommandAccepted]
  // operation. The server SHOULD deliver the relevant events recorded by the
  // original execution, but MAY end the stream immediately if it is unable to
  // determine which events those are.
  rpc ExecuteCommand(ExecuteCommandRequest)
  returns (stream ExecuteCommandResponse);
}

// ExecuteCommandRequest is the input to the [CommandExecutorAPI.ExecuteCommand]
// method.
message ExecuteCommandRequest {
  // ApplicationKey is the key of the application that is the target of the
  // command.
  dogma.protobuf.UUID application_key = 1;

  // CommandTypeId is a unique identifier for the type of command, as per the
  // Dogma message type registry.
  dogma.protobuf.UUID command_type_id = 2;

  // Data is the binary command data obtained by calling
  // [dogma.Message.MarshalBinary] on the command.
  bytes data = 3 [features.field_presence = IMPLICIT];

  // IdempotencyKey is an (optional) application-defined value used to
  // identify the command across retries.
  //
  // If it is non-empty, the server MUST NOT execute the command again if it
  // has already been executed with the same idempotency key.
  string idempotency_key = 4 [features.field_presence = IMPLICIT];

  // ObservedEventTypeIds is a list of type IDs of the events to be observed
  // as a result of executing the command. The client must be explicit about
  // the event types that it understands; there is no mechanism to observe all
  // event types.
  repeated dogma.protobuf.UUID observed_event_type_ids = 5;
}

// ExecuteCommandResponse is the streaming output of the
// [CommandExecutorAPI.ExecuteCommand] method.
message ExecuteCommandResponse {
  // CommandAccepted indicates that the engine has taken ownership of the
  // command.
  message CommandAccepted {}

  // EventRecorded represents the delivery of a single event that was recorded
  // as a result of executing the command.
  message EventRecorded {
    // Envelope is the envelope containing the event.
    dogma.protobuf.Envelope envelope = 1;
  }

  oneof operation {
    CommandAccepted command_accepted = 1;
    EventRecorded   event_recorded   = 2;
  }
}

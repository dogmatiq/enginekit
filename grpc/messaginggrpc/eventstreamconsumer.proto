edition = "2024";
package dogma.messaging.v1;

option go_package = "github.com/dogmatiq/enginekit/grpc/messaginggrpc";

import "github.com/dogmatiq/enginekit/protobuf/envelopepb/envelope.proto";
import "github.com/dogmatiq/enginekit/protobuf/uuidpb/uuid.proto";

// EventStreamConsumerAPI is a service for consuming events from an
// offset-based ordered stream.
service EventStreamConsumerAPI {
  // ListEventStreams lists the streams that the server provides.
  rpc ListEventStreams(ListEventStreamsRequest)
      returns (ListEventStreamsResponse);

  // ConsumeEvents starts consuming from a specific offset within an event
  // stream.
  //
  // If the requested stream ID is unknown to the server it MUST return a
  // NOT_FOUND error with an attached [UnrecognizedEventStream] value. See
  // [UnrecognizedEventStreamError].
  //
  // If the requested offset is beyond the end of the stream, the server
  // SHOULD keep the stream open and send new events as they are written to
  // the stream.
  //
  // The requested type IDs MUST be a subset of those type IDs associated
  // with the stream, as per the result of the ListEventStreams operation. If
  // any other type IDs are requested the server MUST return an
  // INVALID_ARGUMENT error with an attached [UnrecognizedEventType] value
  // for each unrecognized type ID. See [UnrecognizedEventTypeError].
  //
  // If no type IDs are specified the server MUST return an INVALID_ARGUMENT
  // error. This is a pure request-shape violation with no server-state
  // dependent data to report, so it carries no error-details value.
  rpc ConsumeEvents(ConsumeEventsRequest)
      returns (stream ConsumeEventsResponse);
}

// ListEventStreamsRequest is the input to the
// [EventStreamConsumerAPI.ListEventStreams] method.
message ListEventStreamsRequest {}

// ListEventStreamsResponse is the output of the
// [EventStreamConsumerAPI.ListEventStreams] method.
message ListEventStreamsResponse {
  // Streams is a list of event streams that can be consumed from this
  // server.
  repeated EventStream streams = 1;
}

// EventStream describes an offset-based ordered event stream.
message EventStream {
  // EventStreamId is a unique identifier for the stream.
  dogma.protobuf.UUID event_stream_id = 1;

  // MessageTypeIds is the set of message type IDs of events that may appear
  // on the stream.
  repeated dogma.protobuf.UUID message_type_ids = 2;
}

// ConsumeEventsRequest is the input to the
// [EventStreamConsumerAPI.ConsumeEvents] method.
message ConsumeEventsRequest {
  // EventStreamId is the ID from which events are consumed.
  dogma.protobuf.UUID event_stream_id = 1;

  // Offset is the offset of the earliest event to be consumed.
  uint64 offset = 2 [features.field_presence = IMPLICIT];

  // MessageTypeIds is a list of message type IDs identifying the events to
  // be consumed. The consumer must be explicit about the event types that it
  // understands; there is no mechanism to request all event types.
  repeated dogma.protobuf.UUID message_type_ids = 3;
}

// ConsumeEventsResponse is the streaming output of the
// [EventStreamConsumerAPI.ConsumeEvents] method.
message ConsumeEventsResponse {
  // EventDelivery represents the delivery of a single event to the consumer.
  message EventDelivery {
    // Offset is the event's offset within the stream.
    uint64 offset = 1 [features.field_presence = IMPLICIT];

    // Envelope is the envelope containing the event.
    dogma.protobuf.Envelope envelope = 2;
  }

  oneof operation {
    EventDelivery event_delivery = 1;
  }
}
